<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photon SC App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="connection-row">
      <div class="connection-pill"><strong>SC:</strong> <span id="scConnection">Unknown</span></div>
      <div class="connection-pill"><strong>NT:</strong> <span id="ntConnection">Disconnected</span></div>
      <div class="connection-pill"><strong>NT cameras:</strong> <span id="ntCameraCount">0</span></div>
      <div class="connection-pill"><strong>Version:</strong> <span id="scVersion">unknown</span></div>
    </section>

    <section class="tabs-row">
      <div class="tab-bar" id="tabList"></div>
    </section>

    <section class="panel-section">
      <div class="iframe-wrapper">
        <iframe id="tabFrame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        <div id="discoveryPanel" class="discovery-panel" style="display:none">
            <div class="discovery-header">
              <div class="discovery-title">
                <h2>Discovery</h2>
                <div id="discoveryLine" aria-live="polite">Scanning for PhotonVision coprocessors...</div>
                <div id="networkLine" class="small"></div>
              </div>
          </div>

          <div class="discovery-table-wrapper">
            <table id="discoveryTable">
              <thead>
                <tr>
                  <th>IP / Host</th>
                  <th>Ping</th>
                  <th>Serving Photon UI</th>
                  <th>NT source</th>
                </tr>
              </thead>
              <tbody id="discoveryTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

name: Build and Distribute PhotonLibPy

permissions:
  id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-py:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel
        working-directory: ./photon-lib/py
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./photon-lib/py/dist/

  test-py:
    needs: build-py
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system pytest mypy

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install package
        shell: bash
        run: uv pip install --system --no-cache dist/*.whl

      - name: Run Unit Tests
        shell: bash
        run: pytest --import-mode=importlib photon-lib/py/test/

      - name: Run mypy type checking
        run: mypy --show-column-numbers --config-file photon-lib/py/pyproject.toml photon-lib

  test-photonserde-py:
    needs: build-py
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv pip install --system pytest mypy
          uv pip install --system -r photon-serde-tests/requirements.txt

      - name: Generate Python Serde Tests
        working-directory: photon-serde
        run: |
          uv pip install --system -r requirements.txt
          python generate_messages.py --tests

      - name: Upload Python Serde Tests
        uses: actions/upload-artifact@v7
        with:
          name: photon-serde-tests-py
          path: photon-serde-tests/py/

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./photon-lib/py/dist/

      - name: Install PhotonLibPy package
        working-directory: ./photon-lib/py
        shell: bash
        run: |
            uv pip install --system --no-cache dist/*.whl

      - name: Run PhotonSerde tests
        shell: bash
        run: python -m pytest --import-mode=importlib photon-serde-tests/py/AutoSerdeTest.py

  build-python-examples:
    needs: build-py
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system mypy

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./photon-lib/py/dist/

      - name: Install PhotonLibPy package
        working-directory: ./photon-lib/py
        shell: bash
        run: |
            uv pip install --system --no-cache dist/*.whl

      - name: Build Python examples
        working-directory: photonlib-python-examples
        shell: bash
        run: |
          for folder in */;
          do
            echo $folder
            ./test.sh $folder
          done

  deploy:
    needs: [test-py, build-python-examples]
    runs-on: ubuntu-24.04
    # Only upload on tags
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

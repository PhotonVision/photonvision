apply plugin: 'org.photonvision.tools.WpilibTools'

import java.nio.file.Path

ext.licenseFile = file("$rootDir/LICENSE")
ext.externalLicensesFolder = file("$rootDir/ExternalLicenses")
apply from: "${rootDir}/shared/common.gradle"

wpilibTools.deps.wpilibVersion = wpilibVersion

def nativeConfigName = 'wpilibNatives'
configurations {
    wpilibNatives
}
def nativeTasks = wpilibTools.createExtractionTasks {
    configurationName = nativeConfigName
}

nativeTasks.addToSourceSetResources(sourceSets.main)

dependencies {
    wpilibNatives project(path: ':photon-targeting', configuration: 'wpilibNatives')
    wpilibNatives wpilibTools.deps.wpilib("wpimath")
    wpilibNatives wpilibTools.deps.wpilib("wpinet")
    wpilibNatives wpilibTools.deps.wpilib("wpiutil")
    wpilibNatives wpilibTools.deps.wpilib("datalog")
    wpilibNatives wpilibTools.deps.wpilib("ntcore")
    wpilibNatives wpilibTools.deps.wpilib("cscore")
    wpilibNatives wpilibTools.deps.wpilib("apriltag")
    wpilibNatives wpilibTools.deps.wpilib("fields")
    wpilibNatives wpilibTools.deps.wpilib("hal")
    wpilibNatives wpilibTools.deps.wpilib("telemetry")
    wpilibNatives wpilibTools.deps.wpilib("tunables")
    wpilibNatives wpilibTools.deps.wpilibOpenCv(openCVversion)

    // These stay as implementation dependencies since they don't have native code that gets packaged
    implementation 'org.zeroturnaround:zt-zip:1.14'
    implementation "org.xerial:sqlite-jdbc:3.41.0.0"
    implementation 'com.diozero:diozero-core:1.4.1'
    implementation 'com.github.oshi:oshi-core:7.4.0'

    // The JNI libraries use wpilibNatives, the java libraries use implementation
    if (jniPlatform == "linuxarm64") {
        wpilibNatives("org.photonvision:rknn_jni-jni:$rknnVersion:$jniPlatform") {
            transitive = false
        }
        wpilibNatives("org.photonvision:tflite_jni-jni:$tfliteVersion:$jniPlatform") {
            transitive = false
        }
        wpilibNatives("org.photonvision:photon-libcamera-gl-driver-jni:$libcameraDriverVersion:$jniPlatform") {
            transitive = false
        }
    }

    if (jniPlatform == "linuxx86-64") {
        wpilibNatives("org.photonvision:tflite_jni-jni:$tfliteVersion:$jniPlatform") {
            transitive = false
        }
    }

    // vkapriltag_jni does not publish to maven.photonvision.org - see
    // vkapriltag-jni's own repo, which builds and tests the native shim via a
    // hand-rolled CMake build rather than the real WPILib GradleJni/
    // NativeUtils artifact pipeline. $vkAprilTagVersion instead resolves
    // against the anonymous ivy patternLayout repo declared in the root
    // build.gradle, pointed directly at vkapriltag-jni's GitHub Release
    // assets for that tag - no POM/publish step needed, just the two jars
    // its build-and-release.yml already produces on every v* tag push: a
    // plain jar with linux/<arch>/shared/*.so inside for the -jni
    // classifier, matching rknn_jni-jni/tflite_jni-jni's own shape (see
    // e.g. tflite_jni-jni-*-linuxarm64.jar), plus an unclassified -java jar.
    //
    // Bump $vkAprilTagVersion (root build.gradle) to a new vkapriltag-jni
    // tag whenever one is cut; nothing else here needs to change.
    //
    // linuxarm64 only for now: that artifact was built against this
    // machine's exact WPILib OpenCV native (2027-4.13.0-3) for ABI-correct
    // cv::Mat access - see VkAprilTagJNI.cpp's detect(). A linuxx86-64
    // artifact needs the same care, not just a recompile, so it's not wired
    // up here yet (even though vkapriltag-jni's CI already builds and
    // releases one, for its own dev/CI parity - see that repo's workflow
    // comment).
    if (jniPlatform == "linuxarm64") {
        wpilibNatives("org.photonvision:vkapriltag_jni-jni:$vkAprilTagVersion:$jniPlatform") {
            transitive = false
        }
    }
    implementation("org.photonvision:vkapriltag_jni-java:$vkAprilTagVersion") {
        transitive = false
    }

    implementation("org.photonvision:rknn_jni-java:$rknnVersion") {
        transitive = false
    }

    implementation("org.photonvision:tflite_jni-java:$tfliteVersion") {
        transitive = false
    }

    implementation "org.photonvision:photon-libcamera-gl-driver-java:$libcameraDriverVersion"

    implementation "org.photonvision:photon-mrcal-java:$mrcalVersion"

    wpilibNatives("org.photonvision:photon-mrcal-jni:$mrcalVersion:$jniPlatform") {
        transitive = false
    }

    testImplementation group: 'org.junit-pioneer' , name: 'junit-pioneer', version: '2.2.0'
}

task writeCurrentVersion {
    doLast {
        def versionFileIn = file("${rootDir}/shared/PhotonVersion.java.in")
        writePhotonVersionFile(versionFileIn, Path.of("$buildDir", "generated", "java", "org", "photonvision", "PhotonVersion.java"),
                versionString)
    }
}
// https://github.com/wpilibsuite/allwpilib/blob/main/wpilibj/build.gradle#L52
sourceSets.main.java.srcDir "${buildDir}/generated/java/"

compileJava.dependsOn writeCurrentVersion

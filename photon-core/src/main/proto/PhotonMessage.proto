syntax = "proto3";

package photonvision.core.proto;

import "wpimath/protobuf/geometry3d.proto";

// UI -> Frontend format
message VisionModuleEvent {
    string cameraUniqueName = 1;

    // List of all the changes that can be requested
    oneof event {
        bool driverMode = 2;
    }
}

message CameraCalibrationCoefficients {
    // TODO fill this out
    repeated double cameraIntrinsics = 1;
}

message CalibrationUploadedEvent {
    string cameraUniqueName = 1;
    CameraCalibrationCoefficients newCal = 2;
}

message UiChangeEvent {
    oneof event {
        // Messages from UI -> backend
        VisionModuleEvent vm_change = 1;
        // TODO add more
        
        // Messages internal to backend
        bool userConnected = 2;
        CalibrationUploadedEvent calibrationUploaded = 3;

    }
}

// ===========================

message PhotonTarget {
    double yaw = 1;
    double pitch = 2;
    double skew = 3;
    double area = 4;
    double ambiguity = 5;
    int32 fiducialId = 6;
    double confidence = 7;
    int32 classId = 8;
    optional wpi.proto.ProtobufTransform3d pose = 9;
}

message MultitagResult {
    wpi.proto.ProtobufTransform3d bestTransform = 1;
    double bestReprojectionError = 2;
    repeated int32 fiducialIDsUsed = 3;
}

message PipelineResult {
    string cameraUniqueName = 1;
    int64 sequenceID = 2;
    double fps = 3;
    double latency = 4;
    optional double focus = 5;
    repeated PhotonTarget targets = 6;
    optional MultitagResult multitagResult = 7;
    repeated string classNames = 8;
}

message UiMetrics {
}
message LogMessage {
}
message UiCalibrationData {
}
message VisionSourceManagerState {
}
message MutatePipelineSettings {
}

message OutgoingDashboardEvent {
    // Things backend wants to send to dashboards
    oneof event {
        bool fullsettings = 1;
        bool networkTablesConnected = 2;
        PipelineResult updatePipelineResult = 3;
        UiMetrics metrics = 4;
        LogMessage log = 5;
        UiCalibrationData calibrationData = 6;
        VisionSourceManagerState visionSourceManager = 7;
        MutatePipelineSettings mutatePipeline = 8;
    }
}

// ===========================

// Wrapper created by backend to add context
message PhotonDataChangeEvent {
    // Websocket session this request came from, if it came from a websocket
    optional string originCtxSessionId = 1;

    UiChangeEvent event = 2;
}

